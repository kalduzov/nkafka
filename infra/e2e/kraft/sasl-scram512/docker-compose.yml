services:
  kafka-1:
    image: ${KAFKA_IMAGE:-apache/kafka}:${KAFKA_VERSION:-3.9.1}
    container_name: ${KAFKA_CONTAINER_NAME:-nkafka-e2e-kraft-sasl-scram512}
    hostname: kafka-1
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:9092"
    environment:
      KAFKA_ADVERTISED_HOST: ${KAFKA_ADVERTISED_HOST:-localhost}
      KAFKA_EXTERNAL_PORT: ${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4dYfr59lTFyBKgAAfge3lg}
      SASL_USERNAME: ${SASL_USERNAME:-test}
      SASL_PASSWORD: ${SASL_PASSWORD:-test}
      SSL_STORE_PASSWORD: ${SSL_STORE_PASSWORD:-changeit}
    command:
      - /bin/bash
      - -lc
      - |
        cat >/tmp/server.properties <<EOF
        node.id=1
        process.roles=broker,controller
        controller.quorum.voters=1@kafka-1:9093
        controller.listener.names=CONTROLLER
        listeners=INTERNAL://:9094,EXTERNAL://:9092,CONTROLLER://:9093
        advertised.listeners=INTERNAL://kafka-1:9094,EXTERNAL://$${KAFKA_ADVERTISED_HOST}:$${KAFKA_EXTERNAL_PORT}
        listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,CONTROLLER:PLAINTEXT
        inter.broker.listener.name=INTERNAL
        offsets.topic.replication.factor=1
        transaction.state.log.replication.factor=1
        transaction.state.log.min.isr=1
        group.initial.rebalance.delay.ms=0
        auto.create.topics.enable=true
        log.dirs=/var/lib/kafka/data
        sasl.enabled.mechanisms=SCRAM-SHA-512
        listener.name.external.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
        EOF
        if [ ! -f /var/lib/kafka/data/meta.properties ] && [ -n "$${KAFKA_CLUSTER_ID:-}" ]; then
          /opt/kafka/bin/kafka-storage.sh format -t "$${KAFKA_CLUSTER_ID}" -c /tmp/server.properties --ignore-formatted
        fi
        exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
    volumes:
      - kraft_sasl_scram512_data:/var/lib/kafka/data

volumes:
  kraft_sasl_scram512_data:

