services:
  kafka-1:
    image: ${KAFKA_IMAGE:-apache/kafka}:${KAFKA_VERSION:-3.9.1}
    container_name: ${BROKER_1_CONTAINER_NAME:-nkafka-e2e-kraft-ssl-3broker-broker-1}
    hostname: kafka-1
    ports:
      - "${BROKER_1_EXTERNAL_PORT:-29091}:9092"
    environment:
      BROKER_EXTERNAL_PORT: ${BROKER_1_EXTERNAL_PORT:-29091}
      KAFKA_ADVERTISED_HOST: ${KAFKA_ADVERTISED_HOST:-localhost}
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4dYfr59lTFyBKgAAfge3lg}
      SSL_STORE_PASSWORD: ${SSL_STORE_PASSWORD:-changeit}
    command:
      - /bin/bash
      - -lc
      - |
        cat >/tmp/server.properties <<EOF
        node.id=1
        process.roles=broker,controller
        controller.quorum.voters=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
        controller.listener.names=CONTROLLER
        listeners=INTERNAL://:9094,EXTERNAL://:9092,CONTROLLER://:9093
        advertised.listeners=INTERNAL://kafka-1:9094,EXTERNAL://$${KAFKA_ADVERTISED_HOST}:$${BROKER_EXTERNAL_PORT}
        listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:SSL,CONTROLLER:PLAINTEXT
        inter.broker.listener.name=INTERNAL
        offsets.topic.replication.factor=3
        transaction.state.log.replication.factor=3
        transaction.state.log.min.isr=2
        group.initial.rebalance.delay.ms=0
        auto.create.topics.enable=true
        log.dirs=/var/lib/kafka/data
        ssl.keystore.type=PKCS12
        ssl.keystore.location=/etc/kafka/secrets/kafka.keystore.p12
        ssl.keystore.password=$${SSL_STORE_PASSWORD}
        ssl.key.password=$${SSL_STORE_PASSWORD}
        ssl.client.auth=none
        EOF
        if [ ! -f /var/lib/kafka/data/meta.properties ] && [ -n "$${KAFKA_CLUSTER_ID:-}" ]; then
          /opt/kafka/bin/kafka-storage.sh format -t "$${KAFKA_CLUSTER_ID}" -c /tmp/server.properties --ignore-formatted
        fi
        exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
    volumes:
      - kraft_ssl_3broker_broker_1_data:/var/lib/kafka/data
      - ./certs:/etc/kafka/secrets:ro

