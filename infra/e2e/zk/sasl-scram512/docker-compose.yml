services:
  zookeeper-1:
    image: ${ZOOKEEPER_IMAGE:-zookeeper}:${ZOOKEEPER_VERSION:-3.9.3}
    container_name: ${ZOOKEEPER_CONTAINER_NAME:-nkafka-e2e-zk-sasl-scram512-zookeeper}
    hostname: zookeeper-1
    ports:
      - "${ZOOKEEPER_EXTERNAL_PORT:-22181}:2181"
    environment:
      ZOO_MY_ID: 1
      ZOO_CLIENT_PORT: 2181
      ZOO_TICK_TIME: 2000
    volumes:
      - zk_sasl_scram512_zookeeper_data:/data
      - zk_sasl_scram512_zookeeper_datalog:/datalog

  kafka-1:
    image: ${KAFKA_IMAGE:-apache/kafka}:${KAFKA_VERSION:-3.9.1}
    container_name: ${KAFKA_CONTAINER_NAME:-nkafka-e2e-zk-sasl-scram512}
    hostname: kafka-1
    depends_on:
      - zookeeper-1
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:9092"
    environment:
      KAFKA_ADVERTISED_HOST: ${KAFKA_ADVERTISED_HOST:-localhost}
      KAFKA_EXTERNAL_PORT: ${KAFKA_EXTERNAL_PORT:-29092}
      SASL_USERNAME: ${SASL_USERNAME:-test}
      SASL_PASSWORD: ${SASL_PASSWORD:-test}
      SSL_STORE_PASSWORD: ${SSL_STORE_PASSWORD:-changeit}
    command:
      - /bin/bash
      - -lc
      - |
        cat >/tmp/server.properties <<EOF
        broker.id=1
        zookeeper.connect=zookeeper-1:2181
        listeners=INTERNAL://:9094,EXTERNAL://:9092
        advertised.listeners=INTERNAL://kafka-1:9094,EXTERNAL://$${KAFKA_ADVERTISED_HOST}:$${KAFKA_EXTERNAL_PORT}
        listener.security.protocol.map=INTERNAL:PLAINTEXT,EXTERNAL:SASL_PLAINTEXT
        inter.broker.listener.name=INTERNAL
        offsets.topic.replication.factor=1
        transaction.state.log.replication.factor=1
        transaction.state.log.min.isr=1
        group.initial.rebalance.delay.ms=0
        auto.create.topics.enable=true
        log.dirs=/var/lib/kafka/data
        sasl.enabled.mechanisms=SCRAM-SHA-512
        listener.name.external.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
        EOF
        exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
    volumes:
      - zk_sasl_scram512_data:/var/lib/kafka/data

volumes:
  zk_sasl_scram512_data:
  zk_sasl_scram512_zookeeper_data:
  zk_sasl_scram512_zookeeper_datalog:

